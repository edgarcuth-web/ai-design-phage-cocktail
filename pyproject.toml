[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phage-cocktail-predictor"
version = "0.1.0"
description = "Research prototype for phage-host and phage-cocktail infection prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "jsonschema>=4.23,<5",
    "matplotlib>=3.8",
    "pytest>=8.0",
]
reference = [
    "genophi==1.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
