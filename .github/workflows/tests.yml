name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
  padloc-integration:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select PADLOC integration runs
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '(^src/phage_cocktail/(padloc_adapter|sequence_registry|resource_registry|feature_artifact|model_interface)\.py$|^schemas/(feature-artifact-v1|padloc-host-defense-result-v1|sequence-registry-v1)\.schema\.json$|^src/phage_cocktail/schemas/(feature-artifact-v1|padloc-host-defense-result-v1|sequence-registry-v1)\.schema\.json$|^envs/padloc\.yml$|^tests/integration/run_padloc_smoke\.py$|^tests/test_(padloc_adapter|sequence_registry|model_interface)\.py$|^\.github/workflows/tests\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pinned PADLOC environment
        if: steps.paths.outputs.run == 'true'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/padloc.yml
          environment-name: phage-padloc
          cache-environment: true

      - name: Install this project
        if: steps.paths.outputs.run == 'true'
        shell: bash -el {0}
        run: python -m pip install -e .

      - name: Install pinned PADLOC-DB release
        if: steps.paths.outputs.run == 'true'
        shell: bash -el {0}
        env:
          PADLOC_DATA: ${{ runner.temp }}/padloc-db-v2.0.0
        run: padloc --data "$PADLOC_DATA" --db-install v2.0.0

      - name: Download pinned upstream bacterial genome
        if: steps.paths.outputs.run == 'true'
        shell: bash
        env:
          INPUT_DIR: ${{ runner.temp }}/padloc-inputs
        run: |
          mkdir -p "$INPUT_DIR"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/padlocbio/padloc/2afd1d8a730aa899f5c3178c881b697fa3bb5279/test/GCF_004358345.1.fna \
            --output "$INPUT_DIR/host.fna"
          test -s "$INPUT_DIR/host.fna"

      - name: Run real PADLOC and verify FeatureArtifact
        if: steps.paths.outputs.run == 'true'
        shell: bash -el {0}
        env:
          INPUT_DIR: ${{ runner.temp }}/padloc-inputs
          PADLOC_DATA: ${{ runner.temp }}/padloc-db-v2.0.0
          PADLOC_OUTPUT: ${{ runner.temp }}/padloc-artifact
        run: |
          python tests/integration/run_padloc_smoke.py \
            --fasta "$INPUT_DIR/host.fna" \
            --database "$PADLOC_DATA" \
            --outdir "$PADLOC_OUTPUT"

